<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <meta name="theme-color" content="#153f3a" />
    <link rel="stylesheet" href="app.css" />
    <script src="auth.js"></script>
    <script>
      window.__authReady = AthkarAuth.require();
    </script>
    <style>
      .home-welcome {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 7px;
      }

      .home-app-icon {
        width: 58px;
        height: 58px;
        border-radius: 15px;
        object-fit: cover;
        display: block;
      }

      .home-welcome-text {
        font-size: 1.2rem;
        font-weight: 900;
        color: var(--text, #f9fbfa);
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="home-welcome">
          <img src="apple-touch-icon.png" alt="الأذكار" class="home-app-icon" />

          <div class="home-welcome-text" id="homeGreeting">مرحبًا</div>
        </div>
        <div class="top-actions">
          <a
            class="top-action profile-action"
            href="account.html"
            aria-label="الحساب"
            ><svg viewBox="0 0 24 24">
              <circle cx="12" cy="8" r="3.4" />
              <path d="M5.5 20a6.5 6.5 0 0 1 13 0" /></svg></a
          ><button class="top-action" onclick="location.href = 'calendar.html'">
            ＋
          </button>
        </div>
      </header>
      <div class="content">
        <section class="date-strip refined-date">
          <div class="date-main" id="hijri">—</div>
          <div class="date-greg" id="greg">—</div>
          <div class="date-weekday" id="weekday">—</div>
        </section>
        <section class="section">
          <div class="city-row card compact-city">
            <div>
              <div class="eyebrow">المدينة</div>
              <div class="city-copy">مواقيت الصلاة حسب اختيارك</div>
            </div>
            <select id="city"></select>
          </div>
        </section>
        <section class="section">
          <div class="hero" id="hero">
            <div class="hero-kicker" id="stateLabel">الـصـلاة الـقادمة</div>
            <div class="hero-name" id="pName">—</div>
            <div class="hero-time" id="pTime">—</div>
            <div class="hero-count-label" id="countLabel">متبقي على الأذان</div>
            <div class="hero-count" id="pCount">--:--:--</div>
            <div class="hero-foot">
              <span id="iqNote">الإقامة حسب إعداداتك</span
              ><a href="prayer.html">تفاصيل الصلاة ←</a>
            </div>
          </div>
          <div
            id="prayerError"
            class="notice error"
            style="display: none; margin-top: 10px"
          >
            تعذر جلب مواقيت الصلاة. تأكد من اتصال الإنترنت ثم أعد المحاولة.
          </div>
        </section>
        <section class="section">
          <div class="section-head">
            <h2>خلال 7 أيام</h2>
            <a href="calendar.html">التقويم ←</a>
          </div>
          <div id="upcoming" class="upcoming-list"></div>
        </section>
        <section class="section">
          <div class="section-head"><h2>الاستحقاقات القادمة</h2></div>
          <div class="finance-stack">
            <div class="finance gold">
              <div class="finance-top">
                <div class="finance-title">💰 الراتب الحكومي</div>
                <div class="finance-date" id="salaryDate">—</div>
              </div>
              <div class="finance-count rich-count" id="salaryCount">—</div>
            </div>
            <div class="finance">
              <div class="finance-top">
                <div class="finance-title">🇸🇦 حساب المواطن</div>
                <div class="finance-date" id="citizenDate">—</div>
              </div>
              <div class="finance-count rich-count" id="citizenCount">—</div>
            </div>
          </div>
        </section>
      </div>
    </main>
    <div id="nav"></div>
    <script src="ummalqura-data.js"></script>
    <script src="app-core.js"></script>
    <script>
      window.__authReady?.then((user) => {
        if (user)
          document.getElementById("homeGreeting").textContent =
            `مرحبًا، ${user.display_name || user.username}`;
      });
      const now = saNow();
      document.getElementById("hijri").textContent = hijriLong(now).replace(
        /^[^،]+،?\s*/,
        "",
      );
      document.getElementById("greg").textContent = gregLong(now);
      document.getElementById("weekday").textContent = new Intl.DateTimeFormat(
        "ar-SA-u-ca-gregory",
        { timeZone: "Asia/Riyadh", weekday: "long" },
      ).format(now);
      document.getElementById("nav").innerHTML = nav("home");
      let times = null;
      async function initPrayer() {
        try {
          times = await fetchPrayer();
          renderPrayer();
        } catch {
          document.getElementById("hero").style.display = "none";
          document.getElementById("prayerError").style.display = "block";
        }
      }
      function renderPrayer() {
        if (!times) return;
        const st = prayerState(times);
        document.getElementById("pName").textContent = st.name;
        document.getElementById("pTime").textContent = formatTime24to12(
          times[st.key],
        );
        document.getElementById("pCount").textContent = durationText(st.target);
        if (st.mode === "iqamah") {
          document.getElementById("stateLabel").textContent =
            `تم أذان ${st.name}`;
          document.getElementById("countLabel").textContent =
            "متبقي على الإقامة";
          document.getElementById("iqNote").textContent =
            `الإقامة بعد ${st.iq} دقيقة من الأذان`;
        } else {
          document.getElementById("stateLabel").textContent =
            "الـصـلاة الـقـادمة";
          document.getElementById("countLabel").textContent =
            "متبقي على الأذان";
          document.getElementById("iqNote").textContent =
            `الإقامة بعد الأذان بـ ${st.iq} دقيقة`;
        }
      }
      function renderUpcoming() {
        const b = document.getElementById("upcoming"),
          a = upcomingAppointments(7);
        if (!a.length) {
          b.innerHTML =
            '<div class="card empty">لا توجد مواعيد خلال الأيام السبعة القادمة.</div>';
          return;
        }
        b.innerHTML = a
          .map(
            (x) =>
              `<button class="event-row event-button" onclick="location.href='calendar.html?date=${ymd(x._next)}&edit=${encodeURIComponent(x.id)}'"><div class="event-emoji">${esc(x.emoji || "📌")}</div><div><div class="event-title">${esc(x.title)}</div><div class="event-meta">${gregLong(x._next)} · ${x.time || ""}</div></div><div class="event-count compact-cd" data-target="${x._next.toISOString()}">${durationInlineHTML(x._next)}</div></button>`,
          )
          .join("");
      }
      function renderFinance() {
        const s = nextSalary(),
          c = nextCitizen();
        document.getElementById("salaryCount").innerHTML =
          durationInlineHTML(s);
        document.getElementById("salaryDate").textContent =
          gregLong(s) +
          (s.getFullYear() === 2026 ? " · موعد رسمي" : " · حسب القاعدة");
        document.getElementById("citizenCount").innerHTML =
          durationInlineHTML(c);
        document.getElementById("citizenDate").textContent = gregLong(c);
      }
      (async () => {
        await window.__authReady;
        await Promise.all([syncPrayerSettings(), syncUserCalendarData()]);
        await fillCitySelect(document.getElementById("city"));
        await initPrayer();
        renderUpcoming();
        renderFinance();
        setInterval(() => {
          renderPrayer();
          renderUpcoming();
          renderFinance();
        }, 1000);
      })();
    </script>
  </body>
</html>
